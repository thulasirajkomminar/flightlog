---
version: 3
vars:
  REMOTE_URL: https://raw.githubusercontent.com
  REMOTE_URL_REF: v3.12.12
  REMOTE_URL_REPO: schubergphilis/mcvs-golang-action
includes:
  remote:
    taskfile: >-
      {{.REMOTE_URL}}/{{.REMOTE_URL_REPO}}/{{.REMOTE_URL_REF}}/build/task.yml
    vars:
      GOLANGCI_LINT_RUN_TIMEOUT_MINUTES: 10
  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

tasks:
  fix:
    desc: Auto-fix lint and format issues (backend + frontend)
    cmds:
      - task: tagalign
      - task: remote:format
      - task: web:fix

  tagalign:
    desc: Check struct tags alignment
    # tagalign@v1.4.4 bundles golang.org/x/tools v0.30.0, which doesn't understand
    # the export data produced by newer Go toolchains and crashes with
    # "internal error: package ... without types". Run it against go1.26.0, which
    # x/tools v0.30.0 supports, by temporarily lowering the go.mod version.
    cmd: |
      cp go.mod go.mod.tagalign-bak
      sed -i.bak -E 's/^go [0-9]+\.[0-9]+(\.[0-9]+)?$/go 1.26.0/' go.mod && rm -f go.mod.bak
      GOTOOLCHAIN=go1.26.0 go run github.com/4meepo/tagalign/cmd/tagalign@v1.4.4 -fix -order "json,yaml,yml,toml,mapstructure,binding,validate,db,gorm" ./...
      tagalign_status=$?
      mv go.mod.tagalign-bak go.mod
      exit $tagalign_status

  generate:
    desc: Generate Go client from OpenAPI specs
    cmd: go generate ./internal/provider/aerodatabox/api/...

  api:
    desc: Run Go API server
    cmd: go run ./cmd/api

  web:
    desc: Run frontend dev server
    cmd: task web:dev

  dev:
    desc: Run API and frontend locally
    deps: [setup]
    cmd: overmind start -f Procfile.dev

  setup:
    desc: Install all dependencies (Go + frontend)
    cmds:
      - go mod download
      - task: web:install

  seed:
    desc: Seed the database with sample data
    cmd: go run ./cmd/seed

  reseed:
    desc: Wipe and re-seed the database
    cmd: go run ./cmd/seed reseed

  up:
    desc: Start all services in Docker
    cmd: docker compose -f docker-compose.dev.yml up -d

  down:
    desc: Stop Docker services
    cmd: docker compose -f docker-compose.dev.yml down

  clean:
    desc: Remove all containers, volumes and data
    cmds:
      - docker compose -f docker-compose.dev.yml down -v

  build:
    desc: Build all Docker images
    cmds:
      - docker compose -f docker-compose.dev.yml build --no-cache

  default:
    desc: Run all backend and frontend checks
    cmds:
      - task: tagalign
      - task: remote:format
      - task: remote:lint
      - task: remote:opa
      - task: remote:test
      - task: generate
      - task: web:default
